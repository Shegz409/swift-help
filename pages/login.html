<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Swift Help</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2">
        <div class="w-12 h-12 bg-gradient-to-br from-sky-500 to-emerald-500 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-lg">S</div>
      </a>
      <h1 class="text-2xl font-bold mt-4">Welcome to Swift Help</h1>
      <p class="text-slate-500 text-sm mt-1">Login or continue as demo user</p>
    </div>

    <div class="card p-6">
      <!-- Role selector for demo -->
      <div class="mb-6">
        <label class="block text-sm font-medium mb-2">Demo Login As</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="SwiftHelp.login('customer', 'Adaobi Customer')" class="py-3 px-3 rounded-xl border-2 border-slate-200 hover:border-sky-500 hover:bg-sky-50 text-sm font-medium transition">
            👤 Customer
          </button>
          <button onclick="SwiftHelp.login('provider', 'Adebayo Provider')" class="py-3 px-3 rounded-xl border-2 border-slate-200 hover:border-sky-500 hover:bg-sky-50 text-sm font-medium transition">
            🔧 Provider
          </button>
          <button onclick="SwiftHelp.login('driver', 'Chinedu Driver')" class="py-3 px-3 rounded-xl border-2 border-slate-200 hover:border-sky-500 hover:bg-sky-50 text-sm font-medium transition">
            🛵 Driver
          </button>
          <button onclick="SwiftHelp.login('admin', 'Admin User')" class="py-3 px-3 rounded-xl border-2 border-slate-200 hover:border-sky-500 hover:bg-sky-50 text-sm font-medium transition">
            🛡️ Admin
          </button>
        </div>
      </div>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
        <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-slate-400">or email login (demo)</span></div>
      </div>

      <form onsubmit="event.preventDefault(); demoLogin();" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="email" value="demo@swifthelp.ng" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input type="password" id="password" value="demo123" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <button type="submit" class="w-full btn-primary py-3.5">Login</button>
      </form>
    </div>

    <p class="text-center text-sm text-slate-400 mt-6">
      This is a demo prototype. No real authentication.
    </p>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function demoLogin() {
      const email = document.getElementById('email').value;
      if (email.includes('admin')) {
        SwiftHelp.login('admin', 'Admin User');
      } else {
        SwiftHelp.login('customer', 'Demo Customer');
      }
    }

    // Auto redirect if already logged in
    if (SwiftHelp.currentUser) {
      if (SwiftHelp.currentUser.role === 'admin') {
        location.href = '../admin.html';
      } else {
        location.href = '../index.html';
      }
    }
  </script>
</body>
</html>
